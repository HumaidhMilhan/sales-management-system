    <script>
      // Prevent SecurityError: The operation is insecure.
      // This happens when Tailwind CDN tries to access localStorage in a sandboxed iframe.
      try {
        window.localStorage.getItem('test');
      } catch (e) {
        console.warn('LocalStorage access denied. Mocking localStorage to prevent crashes.');
        Object.defineProperty(window, 'localStorage', {
          value: {
            getItem: () => null,
            setItem: () => null,
            removeItem: () => null,
            clear: () => null,
            length: 0,
            key: () => null,
          },
          writable: true,
          configurable: true
        });
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
